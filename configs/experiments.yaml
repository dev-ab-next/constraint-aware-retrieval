embed_model: BAAI/bge-small-en-v1.5
embed_query_prefix: "Represent this sentence for searching relevant passages: "
rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
rrf_k: 60
rerank_depth: 20
k: 3

ablations:
  seeds: [0, 1, 2, 3, 4]
  noisy_preconditions: [0.1, 0.25, 0.5]   # probability each precondition clause is dropped or perturbed
  missing_telemetry: [0.1, 0.25, 0.5]     # probability each metric is missing for the queried device
